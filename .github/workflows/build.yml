name: Build Simulation AI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'core[gemma]' pytest
          python -c "import litert_lm; print('LiteRT-LM API:', litert_lm.__file__)"
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q core/src scripts
      - name: Run tests
        run: python -m pytest -q core/tests
      - name: Validate Godot structure
        run: python scripts/check-godot-structure.py
      - name: Validate all platform export presets
        shell: bash
        run: |
          set -euo pipefail
          test -f export_presets.cfg
          for preset in Linux Windows macOS Android iOS; do
            grep -Fq "name=\"${preset}\"" export_presets.cfg || { echo "Missing preset: ${preset}"; exit 1; }
          done
          grep -Fq 'application/bundle_identifier="org.simulationai.desktop"' export_presets.cfg
          grep -Fq 'config/icon="res://icon.svg"' project.godot
      - name: Check prompt mirrors
        run: python scripts/sync-prompt-pack.py --check
      - name: Validate prompt pack
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=core/src python -m simulation_ai.prompts --validate
      - name: Check generated prompt catalog
        run: |
          python scripts/export-prompt-catalog.py
          git diff --exit-code -- docs/PROMPT_CATALOG.md
      - name: Reject chess product residue
        shell: bash
        run: |
          if grep -RniE 'caissa|chess_board|legal[-_ ]move|saved games' --exclude-dir=.git --exclude=MIGRATION.md --exclude='*.yml' .; then
            echo 'Chess product residue detected'
            exit 1
          fi
      - name: Reject runtime data and binaries
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(sqlite3?|db|litertlm|key|part|exe|AppImage|dmg|zip)$'; then
            echo 'Runtime data or generated binary is tracked.'
            exit 1
          fi

  linux-native-backend:
    name: Build Linux native backend
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build glibc 2.38+ backend variant
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'core[gemma]' pyinstaller
          python scripts/package_backend.py --output dist/backend --name simulation-ai-core-native --with-gemma
          test -f dist/backend/simulation-ai-core-native
          dist/backend/simulation-ai-core-native --diagnose-gemma > dist/backend/gemma-diagnostics.json
          python -c "import json; from pathlib import Path; d=json.loads(Path('dist/backend/gemma-diagnostics.json').read_text()); assert any(c.get('id') == 'litert_lm_native' and c.get('ok') is True for c in d.get('checks', [])), 'Bundled LiteRT-LM native runtime is not healthy'"
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-ai-linux-native-backend
          path: dist/backend/simulation-ai-core-native
          if-no-files-found: error

  package:
    name: Package ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: Windows
            artifact: Simulation-AI-Windows-x64.zip
            godot: Godot_v4.7.1-stable_win64.exe.zip
          - os: macos-15
            preset: macOS
            artifact: Simulation-AI-macOS-universal.dmg
            godot: Godot_v4.7.1-stable_macos.universal.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend packaging dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'core[gemma]' pyinstaller
          python -m pip check
      - name: Install Godot and export templates on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godotArchive = Join-Path $env:RUNNER_TEMP 'simulation-ai-godot.zip'
          $godotInstall = Join-Path $env:RUNNER_TEMP 'simulation-ai-godot'
          $templatesArchive = Join-Path $env:RUNNER_TEMP 'simulation-ai-templates.zip'
          $templatesExtract = Join-Path $env:RUNNER_TEMP 'simulation-ai-templates'
          $templatesInstall = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable'

          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip' -OutFile $godotArchive
          Expand-Archive -Path $godotArchive -DestinationPath $godotInstall -Force
          $godotExecutable = Get-ChildItem -Path $godotInstall -Filter 'Godot_v4.7.1-stable_win64_console.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $godotExecutable) { throw 'Godot Windows console executable was not found after extraction' }

          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz' -OutFile $templatesArchive
          Expand-Archive -Path $templatesArchive -DestinationPath $templatesExtract -Force
          $templatesSource = Join-Path $templatesExtract 'templates'
          if (-not (Test-Path $templatesSource)) { $templatesSource = $templatesExtract }
          New-Item -ItemType Directory -Force $templatesInstall | Out-Null
          Get-ChildItem -Path $templatesSource | Copy-Item -Destination $templatesInstall -Recurse -Force

          "SIMULATION_AI_GODOT_EXE=$($godotExecutable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Godot executable: $($godotExecutable.FullName)"
          Write-Host "Export templates: $templatesInstall"
      - name: Install Godot and export shell
        if: runner.os != 'Windows'
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/${{ matrix.godot }}
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: ${{ matrix.preset }}
          relative_export_path: dist/godot
          verbose: true
          cache: true
      - name: Export Windows shell directly
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsExport = 'dist/godot/Windows/SimulationAI-Windows.exe'
          New-Item -ItemType Directory -Force (Split-Path $windowsExport) | Out-Null
          & $env:SIMULATION_AI_GODOT_EXE --headless --path . --export-release 'Windows' $windowsExport --verbose
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $windowsExport)) { throw "Godot did not create $windowsExport" }
      - name: Build Python backend executable
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/package_backend.py --output dist/package/backend --with-gemma
          python -c "from pathlib import Path; p=Path('dist/package/backend'); assert any(item.is_file() for item in p.iterdir()), f'No backend artifact in {p}'"
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/package/backend/simulation-ai-core.exe --diagnose-gemma > dist/package/backend/gemma-diagnostics.json
          else
            dist/package/backend/simulation-ai-core --diagnose-gemma > dist/package/backend/gemma-diagnostics.json
          fi
          python -c "import json; from pathlib import Path; d=json.loads(Path('dist/package/backend/gemma-diagnostics.json').read_text()); assert any(c.get('id') == 'litert_lm_native' and c.get('ok') is True for c in d.get('checks', [])), 'Bundled LiteRT-LM native runtime is not healthy'"
      - name: Assemble Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package/app/backend | Out-Null
          Copy-Item dist/godot/Windows/* dist/package/app/ -Recurse -Force
          Copy-Item dist/package/backend/* dist/package/app/backend/ -Recurse -Force
          Compress-Archive -Path dist/package/app/* -DestinationPath "dist/${{ matrix.artifact }}" -Force
      - name: Assemble macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg_root="dist/package/dmg-root"
          mkdir -p "$dmg_root"
          ditto -x -k dist/godot/macOS/SimulationAI-macOS.zip "$dmg_root"
          mac_app="$(find "$dmg_root" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$mac_app"
          mkdir -p "$mac_app/Contents/Resources/backend"
          cp -a dist/package/backend/. "$mac_app/Contents/Resources/backend/"
          chmod +x "$mac_app/Contents/Resources/backend/simulation-ai-core"
          codesign --force --sign - "$mac_app/Contents/Resources/backend/simulation-ai-core"
          codesign --force --deep --sign - "$mac_app"
          codesign --verify --deep --strict "$mac_app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "Simulation AI" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "dist/${{ matrix.artifact }}"
          test -f "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Simulation-AI-${{ matrix.preset }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  linux:
    name: Package Linux x64
    needs: [preflight, linux-native-backend]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend packaging dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'core[gemma]' pyinstaller
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: simulation-ai-linux-native-backend
          path: dist/package/backend
      - name: Export Linux shell
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Linux
          relative_export_path: dist/godot
          verbose: true
          cache: true
      - name: Build portable Linux backend variant
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/package_backend.py --output dist/package/backend --with-gemma
          test -f dist/package/backend/simulation-ai-core
          test -f dist/package/backend/simulation-ai-core-native
          dist/package/backend/simulation-ai-core --diagnose-gemma > dist/package/backend/gemma-diagnostics.json
          python -c "import json; from pathlib import Path; d=json.loads(Path('dist/package/backend/gemma-diagnostics.json').read_text()); assert any(c.get('id') == 'litert_lm_native' and c.get('ok') is True for c in d.get('checks', [])), 'Bundled LiteRT-LM native runtime is not healthy'"
      - name: Assemble Linux package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/app
          cp -a dist/godot/Linux/. dist/package/app/
          cp -a dist/package/backend/. dist/package/app/backend/
          chmod +x dist/package/app/SimulationAI-Linux.x86_64
          chmod +x dist/package/app/backend/simulation-ai-core dist/package/app/backend/simulation-ai-core-native
          tar -C dist/package/app -czf dist/Simulation-AI-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Simulation-AI-Linux
          path: dist/Simulation-AI-Linux-x64.tar.gz
          if-no-files-found: error

  android:
    name: Android Godot shell
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Export Android shell
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          relative_export_path: dist/godot
          export_debug: true
          verbose: true
          cache: true
      - uses: actions/upload-artifact@v4
        with:
          name: Simulation-AI-Android
          path: dist/godot/Android
          if-no-files-found: error

  ios:
    name: iOS unsigned Godot project
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Export unsigned iOS project
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: iOS
          relative_export_path: dist/godot
          export_debug: true
          verbose: true
          cache: true
      - uses: actions/upload-artifact@v4
        with:
          name: Simulation-AI-iOS-unsigned
          path: dist/godot/iOS
          if-no-files-found: error
