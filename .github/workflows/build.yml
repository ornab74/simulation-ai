name: Build Simulation AI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  PYTHON_VERSION: "3.11"

jobs:
  preflight:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install core dependencies
        run: python -m pip install -e core pytest
      - name: Compile Python
        run: python -m compileall -q core/src scripts
      - name: Run tests
        run: python -m pytest -q core/tests
      - name: Validate Godot structure
        run: python scripts/check-godot-structure.py
      - name: Reject runtime data and binaries
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(sqlite3?|db|litertlm|key|part|exe|AppImage|dmg|zip)$'; then
            echo 'Runtime data or generated binary is tracked.'
            exit 1
          fi

  package:
    name: Package ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: Linux
            artifact: Simulation-AI-Linux-x64.tar.gz
            godot: Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          - os: windows-2025
            preset: Windows
            artifact: Simulation-AI-Windows-x64.zip
            godot: Godot_v${{ env.GODOT_VERSION }}-stable_win64.exe.zip
          - os: macos-15
            preset: macOS
            artifact: Simulation-AI-macOS-universal.zip
            godot: Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend packaging dependencies
        run: python -m pip install -e core pyinstaller
      - name: Install Godot and export shell
        uses: firebelley/godot-export@v6.1.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/${{ matrix.godot }}
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: ${{ matrix.preset }}
          relative_export_path: dist/godot
          cache: true
      - name: Build Python backend executable
        run: python scripts/package_backend.py --output dist/package/backend
      - name: Assemble Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/app
          cp -a dist/godot/Linux/. dist/package/app/
          cp -a dist/package/backend/. dist/package/app/backend/
          chmod +x dist/package/app/SimulationAI-Linux.x86_64 dist/package/app/backend/simulation-ai-core
          tar -C dist/package/app -czf "dist/${{ matrix.artifact }}" .
      - name: Assemble Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package/app/backend | Out-Null
          Copy-Item dist/godot/Windows/* dist/package/app/ -Recurse -Force
          Copy-Item dist/package/backend/* dist/package/app/backend/ -Recurse -Force
          Compress-Archive -Path dist/package/app/* -DestinationPath "dist/${{ matrix.artifact }}" -Force
      - name: Assemble macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/app/backend
          ditto -x -k dist/godot/macOS/SimulationAI-macOS.zip dist/package/app
          cp -a dist/package/backend/. dist/package/app/backend/
          ditto -c -k --sequesterRsrc --keepParent dist/package/app "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Simulation-AI-${{ matrix.preset }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
